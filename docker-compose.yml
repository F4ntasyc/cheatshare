services:
  backend:
    build: ./backend
    container_name: cheatshare-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build: ./frontend
    container_name: cheatshare-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend