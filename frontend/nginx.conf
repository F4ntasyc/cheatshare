server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { client_max_body_size 11m; proxy_pass http://backend:8000/; proxy_set_header Host $host; }
  # Aset ber-hash dari Vite: cache selamanya; file tak ada = 404 (bukan index.html).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # index.html, fallback SPA, dan file public lain: selalu revalidasi.
  # (add_header tidak diwariskan antar location, jadi ditulis per location.)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
